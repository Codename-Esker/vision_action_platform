{% extends "base.html" %}
{% block title %}로그인 | 동작 분석 플랫폼{% endblock %}
{% block content %}
    <h1>로그인</h1>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        {% if next %}
            <input type="hidden" name="next" value="{{ next }}">
        {% endif %}
        <button type="submit">로그인</button>
    </form>
{% endblock %}
