x-backend: &backend
  image: vision-action-backend:local
  build: ./backend
  env_file: .env
  environment:
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    CELERY_BROKER_URL: redis://redis:6379/0
    FASTAPI_BASE_URL: http://fastapi:8001
  volumes:
    - ./backend/media:/app/media

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "127.0.0.1:${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:56379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 20

  fastapi:
    build: ./ai_service
    ports:
      - "127.0.0.1:8001:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=3).read()"
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  django:
    <<: *backend
    command: python manage.py runserver 0.0.0.0:8002 --noreload
    ports:
      - "127.0.0.1:8002:8002"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery:
    <<: *backend
    command: celery -A config worker --loglevel=INFO --pool=solo
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fastapi:
        condition: service_healthy

volumes:
  postgres_data:
